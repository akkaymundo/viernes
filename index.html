.logo.img{width:150px;height:150px;border-radius:0;background:transparent;border:0;box-shadow:none;overflow:visible;filter:drop-shadow(0 12px 18px rgba(20,8,60,.55))}
.logo.img .lb{border-radius:10px;left:20%;right:20%;bottom:6px}
.logo.ed{cursor:pointer;border-style:dashed}
.logo .lb{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);font-size:10px;font-weight:700;padding:3px 0}
.t3d{margin:0;white-space:nowrap;font-size:clamp(14px,5vw,46px);letter-spacing:.5px;font-weight:900;color:#fff;transform:perspective(700px) rotateX(14deg);text-shadow:0 1px 0 #ddd9ff,0 2px 0 #c0baff,0 3px 0 #a39cf5,0 4px 0 #867de6,0 5px 0 #6b61cf,0 6px 0 #5249b3,0 7px 0 #3f3790,0 14px 18px rgba(15,8,60,.55)}
.hero p{margin:0;opacity:.9;font-size:13.5px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.2);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;backdrop-filter:blur(6px)}
nav{display:flex;gap:6px;overflow-x:auto;max-width:960px;margin:-26px auto 14px;padding:7px;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:20px;box-shadow:var(--sh);position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;width:calc(100% - 20px)}
nav button{border:0;background:transparent;color:var(--mu);padding:9px 15px;border-radius:14px;font-weight:700;white-space:nowrap;cursor:pointer;font-size:13.5px}
nav button.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}
main{max-width:1000px;margin:0 auto;padding:4px 12px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.stat i{font-style:normal;font-size:22px}.stat b{font-size:30px;display:block;line-height:1.1;margin-top:4px}.stat span{color:var(--mu);font-size:12.5px}
.box{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.box h3{margin:0 0 10px}
.btn{border:0;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:9px 15px;border-radius:12px;font-weight:700;cursor:pointer;font-size:13px}
.btn.g{background:transparent;color:var(--pr);border:1px solid var(--ln)}.btn.r{background:var(--bad)}.btn.ok{background:var(--ok)}.btn.s{padding:5px 10px;font-size:12px;border-radius:9px}
.person{background:var(--solid);border:1px solid var(--ln);border-radius:16px;padding:11px 12px;margin:9px 0;position:relative;box-shadow:0 2px 10px rgba(60,70,130,.06)}
.pr{display:flex;gap:11px;align-items:center}
.av{flex:none;overflow:hidden;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;border:3px solid var(--solid);box-shadow:0 0 0 2px var(--c)}
.nm{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:10.5px;padding:2px 8px;border-radius:12px;background:var(--bg);color:var(--mu);border:1px solid var(--ln);font-weight:700}
.tag.off{background:#fef3c7;color:#92400e;border-color:#fde68a}.tag.dead{background:#374151;color:#e5e7eb;border-color:#374151}
.avc{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.by{font-size:11.5px;font-weight:700;color:var(--mu);line-height:1}
.av img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
.dd .av{filter:grayscale(.85)}
.sp{font-size:13px;color:var(--mu);margin-top:2px}
.note{font-size:13px;color:var(--mu);margin-top:6px;white-space:pre-wrap}
.acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.person.hk{margin-bottom:0}
.kids{margin-left:26px;padding-left:16px;padding-top:9px;margin-bottom:9px;border-left:3px solid var(--lc,#6366f1);border-radius:0 0 0 14px}
.kids>.person:before{content:"";position:absolute;left:-19px;top:31px;width:19px;height:3px;background:var(--lc,#6366f1);border-radius:2px}
.kids>.person:after{content:"";position:absolute;left:-25px;top:25px;width:12px;height:12px;border-radius:50%;background:var(--lc,#6366f1);border:2px solid var(--solid)}
.nick{font-size:.72em;font-weight:600;color:var(--mu);margin-left:2px}
.person.hit{box-shadow:0 0 0 2px var(--pr),0 6px 18px rgba(99,102,241,.25)}
mark{background:#fde68a;color:#111;border-radius:4px;padding:0 2px}
.sbar{max-width:960px;margin:0 auto 12px;padding:0 10px;display:flex;gap:8px;align-items:center}
.sbar input{flex:1;border-radius:16px;padding:12px 14px;background:var(--card);box-shadow:var(--sh)}
#sc{font-size:12px;color:var(--mu);white-space:nowrap;font-weight:700}
#f_n,#f_m,#f_k,#f_o,#f_t,.sn,#hn{text-transform:uppercase}
dialog{border:0;border-radius:22px;padding:0;width:min(520px,94vw);background:var(--solid);color:var(--tx);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,12,25,.55);backdrop-filter:blur(3px)}
.dl{padding:18px;max-height:86vh;overflow:auto}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:11px 0 3px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:6px;align-items:center;margin-top:6px}.row input[type=checkbox]{width:auto}
.hint{font-size:12.5px;color:var(--mu)}.empty{color:var(--mu);text-align:center;padding:20px}
.bar2{height:12px;border-radius:8px;background:linear-gradient(90deg,var(--pr),var(--pr2))}
.adm{background:linear-gradient(135deg,#059669,#10b981);color:#fff;border-radius:16px;padding:11px 14px;margin-bottom:12px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh)}.adm.mem{background:linear-gradient(135deg,#4f46e5,#7c3aed)}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:#111827;color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ft{position:relative;overflow:hidden;margin-top:10px;padding:34px 14px calc(26px + env(safe-area-inset-bottom,0px));color:#fff;text-align:center;border-radius:30px 30px 0 0;background-image:radial-gradient(circle at 15% 85%,rgba(255,255,255,.2),transparent 45%),radial-gradient(circle at 85% 10%,rgba(255,255,255,.14),transparent 40%),linear-gradient(135deg,#4338ca,#7c3aed 55%,#c026d3)}
.ftw{position:relative;z-index:1}.ft1{font-weight:800;letter-spacing:.6px;font-size:16px}.ft2{font-size:13px;opacity:.92;margin-top:3px}.ft2 a{color:#fff;font-weight:800;text-decoration:underline;text-underline-offset:3px}.ft3{font-size:12px;opacity:.75;margin-top:8px}
.ft .deco{transform-origin:center}.ft .deco.r{transform:scaleX(-1)}
.hand{display:inline-block;font-size:21px;line-height:1;align-self:center;animation:pt .9s ease-in-out infinite}
@keyframes pt{0%,100%{transform:translateX(-5px)}50%{transform:translateX(6px)}}
.btn.pulse{animation:pl 1.6s ease-out infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(99,102,241,.55)}70%{box-shadow:0 0 0 10px rgba(99,102,241,0)}100%{box-shadow:0 0 0 0 rgba(99,102,241,0)}}
@media (prefers-reduced-motion:reduce){.btn.pulse{animation:none}}
.nf{background:#111827;color:#fff;border-radius:18px;padding:14px 44px 14px 16px;box-shadow:0 12px 30px rgba(0,0,0,.45);cursor:pointer;position:relative;animation:nin .35s ease;border-left:5px solid #f59e0b}
.nf.new{border-left-color:#10b981}
.nf.req{border-left-color:#6366f1}
.nf .x{position:absolute;right:8px;top:6px;background:transparent;border:0;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px}
@keyframes nin{from{transform:translateY(-18px);opacity:0}to{transform:none;opacity:1}}
#notif{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);width:min(430px,calc(100% - 20px));z-index:60}
.person.flash{animation:fl 1s ease-in-out 3;box-shadow:0 0 0 3px #f59e0b}
@keyframes fl{50%{box-shadow:0 0 0 8px rgba(245,158,11,.45)}}
.sres{display:none;max-width:960px;margin:-4px auto 12px;padding:0 10px}
.srp{background:var(--card);backdrop-filter:blur(12px);border:2px solid var(--pr);border-radius:18px;padding:6px;max-height:52vh;overflow:auto;animation:sin .25s ease,glw 1.8s ease-in-out infinite}
.srh{font-size:12.5px;font-weight:700;color:var(--pr);padding:6px 10px}
.sr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--solid);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:8px 10px;margin:5px 0;cursor:pointer;font:inherit}
.sr:active,.sr:hover{border-color:var(--pr);background:var(--bg)}
.sr .st{flex:1;min-width:0;display:flex;flex-direction:column}.sr .st small{color:var(--mu);font-size:12px}
.sr .chev{font-size:22px;color:var(--pr);font-weight:800}
.av.sm{width:40px;height:40px;font-size:13px}
@keyframes sin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@keyframes glw{0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,.45)}50%{box-shadow:0 0 0 7px rgba(99,102,241,0)}}
@media (prefers-reduced-motion:reduce){.srp{animation:none}}
@media (max-width:700px){
#tl{overflow-x:auto;overflow-y:hidden;padding:4px 4px 8px;-webkit-overflow-scrolling:touch}
#tl .person{min-width:285px}
.kids{margin-left:10px;padding-left:11px}
.kids>.person:before{left:-14px;width:14px}
.kids>.person:after{left:-20px}
}
.sbar{flex-wrap:wrap}
.sbar input{flex:1 1 200px}
.sbar select{flex:1 1 160px;border-radius:16px;padding:12px 14px;background:var(--card);box-shadow:var(--sh);font-weight:700;color:var(--pr)}
.err{background:#fff1f2;color:#9f1239;border-radius:14px;padding:14px;margin:12px 0}

<script>
(function(){
var K='amv_standalone_v1',D={},L=[];
try{D=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){D={}}
function sv(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function ping(){setTimeout(function(){L.slice().forEach(function(l){l()})},0)}
function snapC(c){var pre=c+'/';return {docs:Object.keys(D).filter(function(k){return k.indexOf(pre)===0}).map(function(k){var id=k.slice(pre.length),v=D[k];return {id:id,data:function(){return JSON.parse(JSON.stringify(v))}}})}}
function snapD(p){var v=D[p];return {exists:v!==undefined,data:function(){return JSON.parse(JSON.stringify(v))}}}
function ref(p){return {
 set:function(d){D[p]=JSON.parse(JSON.stringify(d));sv();ping();return Promise.resolve()},
 update:function(d){D[p]=Object.assign({},D[p]||{},JSON.parse(JSON.stringify(d)));sv();ping();return Promise.resolve()},
 delete:function(){delete D[p];sv();ping();return Promise.resolve()},
 onSnapshot:function(cb){function f(){cb(snapD(p))}L.push(f);setTimeout(f,0);return function(){}}}}
var db={doc:ref,collection:function(c){return {get:function(){var r=snapC(c);r.size=r.docs.length;r.empty=!r.docs.length;return Promise.resolve(r)},doc:function(id){return ref(c+'/'+id)},onSnapshot:function(cb){function f(){cb(snapC(c))}L.push(f);setTimeout(f,0);return function(){}}}}};
window.addEventListener('storage',function(e){if(e.key===K){try{D=JSON.parse(e.newValue||'{}')}catch(x){}ping()}});
window.__amv={dump:function(){return JSON.stringify(D)},load:function(t){var o=JSON.parse(t);if(!o||typeof o!=='object')throw 0;D=o;sv();ping()}};
window.__cloud=false;
if(window.FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&window.firebase){try{
 firebase.initializeApp(FIREBASE_CONFIG);var fs=firebase.firestore();db=fs;window.__cloud=true;
 var COLS_=['people','notes','pending','meta','adminacct'];
 window.__amv={dump:function(){return Promise.all(COLS_.map(function(c){return fs.collection(c).get()})).then(function(rs){var o={};rs.forEach(function(r,i){r.docs.forEach(function(d){o[COLS_[i]+'/'+d.id]=d.data()})});return JSON.stringify(o)})},
  load:function(t){var o=JSON.parse(t);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;return Promise.all(Object.keys(o).map(function(k){return fs.doc(k).set(o[k])}))}};
window.__diag=function(){
  return fs.doc('meta/ping').set({t:Date.now()}).then(function(){return fs.collection('people').get({source:'server'})}).then(function(r){return '✔ Nakakonekta sa server ng database. May '+r.size+' miyembro sa online database.'}).catch(function(e){return '⚠ Hindi umabot sa server: '+((e&&(e.code||e.message))||'hindi alam na error')+'. Kung "permission-denied", i-Publish ang Rules sa Firebase.'});
 };
}catch(e){window.__cloud=false}}
window.claude={use:function(n){return Promise.resolve(n==='db'?db:n==='user'?{canEdit:function(){return Promise.resolve(false)},can:function(){return Promise.resolve(true)},isOwner:function(){return Promise.resolve(false)}}:null)}};
})();
</script>
<script>
(function(){
var isOwn=false,platAdmin=false,pwAdmin=false,adminDoc=null,curPhoto='',P=[],N=[],Q=[],db=null,isAdmin=false,canWrite=null,tab='dash',q='',col={},ready=false,msg='',$=function(i){return document.getElementById(i)};
var COLS=['#6366f1','#0ea5e9','#10b981','#f59e0b','#ef4444','#ec4899','#8b5cf6','#14b8a6'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function byId(id){return P.find(function(p){return p.id===id})}
function gen(p){var g=0,n=0;while(p&&p.parent&&n++<60){p=byId(p.parent);g++}return g}
function kidsOf(id){return P.filter(function(p){return p.parent===id}).sort(function(a,b){return (a.ts||0)-(b.ts||0)})}
function desc(id){var r=[id];kidsOf(id).forEach(function(k){r=r.concat(desc(k.id))});return r}
function psrc(v){return v&&v.indexOf('data:image/jpeg;base64,')===0?v:(v?'/_blob/'+encodeURIComponent(v):'')}
function by(p){return p.born?'<div class="by">'+esc(p.born)+'</div>':''}
function avh(p){return p.photo?'<img alt="" src="'+esc(psrc(p.photo))+'">':p.gender==='M'?'<span style="font-size:32px;line-height:1">👨</span>':p.gender==='F'?'<span style="font-size:32px;line-height:1">👩</span>':esc(ini(p.name))}
function ini(n){return n.split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase()}
function snapToArr(s){return s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o})}

function render(){
 $('who').textContent=!db?'🔒 Hindi naka-sign in':isAdmin?'👑 ADMIN ✔':(canWrite===false?'👁 View lang':'👤 Miyembro');
 var t=[['dash','🏠 Home'],['tree','🌳 Family Tree'],['off','⭐ Mga Opisyal'],['hist','📖 Kasaysayan'],['pend','⏳ Approval'+(Q.length?' ('+Q.length+')':'')],['set','⚙ Settings']];
 $('nav').innerHTML=t.map(function(x){return '<button data-t="'+x[0]+'" class="'+(tab===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('');
 var h='';
 if(!db)h='<div class="err"><b>Kailangan mag-sign in sa Claude</b> para makita at mai-edit ang shared na family tree. Kung wala kang access, hilingin sa admin na i-invite ka sa Share.</div>';
 else if(!ready)h='<div class="empty">Naglo-load ng data…</div>';
 else h=tab==='dash'?dash():tab==='tree'?treeTab():tab==='off'?offs():tab==='hist'?hist():tab==='pend'?pend():setT();
 $('app').innerHTML=(db&&ready?(isAdmin?'<div class="adm"><span>👑 NAKA-ADMIN KA — agad na nase-save ang mga pagbabago</span>'+'</div>':'<div class="adm mem"><span>👤 Miyembro ka — kailangan ng approval ng admin</span><button class="btn s" style="background:#fff;color:#4338ca" data-a="lgin">⚙ Settings</button></div>'):'')+(msg?'<div class="box">'+esc(msg)+'</div>':'')+h;
 if(tab==='tree'&&db&&ready)drawTree();
 showRes();
}
function dash(){
 var maxg=0,dead=0,sp=0,o=0,by={};
 P.forEach(function(p){var g=gen(p);maxg=Math.max(maxg,g);by[g]=(by[g]||0)+1;if(p.dead)dead++;sp+=(p.spouses||[]).length;if(p.off)o++});
 var rows=Object.keys(by).map(function(g){return '<div class="row"><b style="width:105px">Generation '+g+'</b><div class="bar2" style="width:'+Math.max(5,by[g]/Math.max(1,P.length)*70)+'%"></div><b>'+by[g]+'</b></div>'}).join('');
 var S=[['👪',P.length,'Kabuuang miyembro'],['🌿',maxg,'Mga henerasyon'],['💍',sp,'Mga asawa'],['✝',dead,'Yumao na'],['⭐',o,'Mga opisyal'],['⏳',Q.length,'Naghihintay ng approval']];
 return '<div class="grid">'+S.map(function(s){return '<div class="stat"><i>'+s[0]+'</i><b>'+s[1]+'</b><span>'+s[2]+'</span></div>'}).join('')+'</div><div class="box"><h3>Bawat Henerasyon</h3>'+(rows||'<div class="empty">Wala pang data.</div>')+'</div><div class="box"><button class="btn" data-a="gt">Buksan ang Family Tree →</button></div>';
}
function treeTab(){
 return '<div class="box"><p class="hint" style="margin-bottom:0">'+(isAdmin?'Admin ka — agad na nase-save ang mga pagbabago at makikita ng lahat.':canWrite===false?'View-only ang access mo.':'Ang mga idadagdag/ie-edit/ide-delete mo ay ipapadala muna sa Admin para ma-approve.')+'</p></div><div id="tl"></div>';
}
function dn(p){var n=String(p.name||'').trim(),m=String(p.mid||'').trim();if(!m)return n;var w=n.split(/\s+/);if(w.length<2)return n+' '+m;var l=w.pop();return w.join(' ')+' '+m+' '+l}
function isCol(p){return col[p.id]===undefined?gen(p)>=1:col[p.id]}
function mt(p){var t=[dn(p),p.nick,p.born,p.off].concat((p.spouses||[]).map(function(x){return x.n})).join(' ').toLowerCase();return t.indexOf(q.toLowerCase())>=0}
function hl(t){t=String(t==null?'':t);if(!q)return esc(t);var i=t.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(t);return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length))}
function card(p){
 var g=gen(p),lc=COLS[Math.max(g-1,0)%COLS.length],c=p.gender==='M'?'#3b82f6':p.gender==='F'?'#ec4899':COLS[g%COLS.length],kids=kidsOf(p.id),sp=(p.spouses||[]).map(function(s){return hl(s.n)+(s.d?' ✝':'')}).join(' • ');
 var match=!q||mt(p);
 var kh=kids.map(card).join(''),show=kh&&(!isCol(p)||q);
 if(q&&!match&&!kh)return '';
 var h='<div id="pc_'+p.id+'" class="person '+(p.dead?'dd':'')+(show?' hk':'')+(q&&match?' hit':'')+'"><div class="pr"><div class="avc"><div class="av" style="background:'+c+';--c:'+c+'">'+avh(p)+'</div>'+by(p)+'</div><div style="min-width:0"><div class="nm">'+hl(dn(p))+(p.nick?' <span class="nick">“'+hl(p.nick)+'”</span>':'')+(p.dead?' ✝':'')+'<span class="tag" style="color:'+lc+';border-color:'+lc+';background:'+lc+'22">Gen '+g+'</span>'+(p.dead?'<span class="tag dead">Yumao na</span>':'')+(p.off?'<span class="tag off">⭐ '+esc(p.off)+'</span>':'')+'</div>'+(sp?'<div class="sp">💍 '+sp+'</div>':'')+'</div></div>'+(p.note?'<div class="note">'+esc(p.note)+'</div>':'')+
 '<div class="acts">'+(canWrite!==false?'<button class="btn s" data-a="add" data-id="'+p.id+'">+ Anak</button><button class="btn g s" data-a="edit" data-id="'+p.id+'">Edit</button>'+(p.parent?'<button class="btn g s" data-a="del" data-id="'+p.id+'">Delete</button>':''):'')+(kids.length?'<button class="btn g s'+(isCol(p)?' pulse':'')+'" data-a="tg" data-id="'+p.id+'">'+(isCol(p)?'▸ Ipakita ('+kids.length+')':'▾ Itago')+'</button>':'')+'</div></div>';
 if(show)h+='<div class="kids" style="--lc:'+COLS[g%COLS.length]+'">'+kh+'</div>';
 return h;
}
function drawTree(){var r=P.filter(function(p){return !p.parent||!byId(p.parent)});var h=r.map(card).join('');if(q&&!h)h='<div class="empty">Walang nakita para sa "'+esc(q)+'"</div>';$('tl').innerHTML=h||'<div class="empty">Wala pang miyembro.</div>';var c=$('sc');if(c)c.textContent=q?P.filter(mt).length+' nakita':''}
function offs(){var l=P.filter(function(p){return p.off});return '<div class="box"><h3>⭐ Mga Opisyal ng Pamilya</h3>'+(l.length?l.map(function(p){return '<div class="person"><div class="pr"><div class="avc"><div class="av" style="background:#f59e0b;--c:#f59e0b">'+avh(p)+'</div>'+by(p)+'</div><div><div class="nm">'+hl(dn(p))+(p.nick?' <span class="nick">“'+hl(p.nick)+'”</span>':'')+(p.dead?' ✝':'')+'</div><span class="tag off">'+esc(p.off)+'</span></div></div></div>'}).join(''):'<div class="empty">Wala pa. I-Edit ang miyembro at ilagay ang Posisyon.</div>')+'</div>'}
function hist(){return '<div class="box"><h3>📖 Kasaysayan ng Pamilya</h3>'+(N.length?N.sort(function(a,b){return (b.ts||0)-(a.ts||0)}).map(function(n){return '<div class="person"><div class="hint">'+esc(n.date||'')+'</div><div class="note" style="color:var(--tx);margin-top:2px">'+esc(n.text)+'</div>'+(isAdmin?'<div class="acts"><button class="btn r s" data-a="hdel" data-id="'+n.id+'">Delete</button></div>':'')+'</div>'}).join(''):'<div class="empty">Wala pang tala.</div>')+(canWrite!==false?'<label>Magdagdag ng tala</label><textarea id="hn" rows="4" placeholder="Isulat ang kasaysayan…"></textarea><div class="acts"><button class="btn" data-a="hadd">'+(isAdmin?'I-save':'Ipadala sa Admin')+'</button></div>':'')+'</div>'}
function setT(){
 var h='<div class="box"><h3>⚙ Settings</h3><div class="adm'+(isAdmin?'':' mem')+'" style="margin-bottom:0"><span>'+(isAdmin?'👑 NAKA-ADMIN KA':'👤 Miyembro ka')+'</span></div></div>';
 if(!isAdmin)h+='<div class="box"><h3>🔑 Login bilang Admin</h3><label>Username</label><input data-nc="1" id="au" autocomplete="username"><label>Password</label><input id="ap" type="password" autocomplete="current-password"><div class="acts" style="margin-top:12px"><button class="btn" data-a="lgo">Login</button></div></div>';
 else if(pwAdmin)h+='<div class="box"><h3>Logout</h3><p class="hint">Mag-logout para bumalik bilang miyembro.</p><button class="btn r" data-a="lgout">Logout</button></div>';
 else h+='<div class="box"><p class="hint">Naka-login ka bilang may-ari/Editor ng page, na naka-link sa iyong Claude account.</p></div>';
 if(platAdmin&&!isOwn)h+='<div class="box"><p class="hint">Ang gumawa/may-ari ng site lang ang makakapagpalit ng admin password.</p></div>';
 if(isOwn||pwAdmin||!adminDoc)h+='<div class="box"><h3>Admin account</h3><p class="hint">Itakda ang username at password na gagamitin ng ibang miyembro para maging admin. Papalitan nito ang luma.</p><label>Username</label><input data-nc="1" id="su" value="'+esc(adminDoc?adminDoc.user:'')+'" autocomplete="off"><label>Bagong password (6+ letra)</label><input id="sp" type="password" autocomplete="new-password"><div class="acts" style="margin-top:12px"><button class="btn" data-a="sset">I-save</button></div></div>';
 h+='<div class="box"><h3>💾 Backup / Restore</h3><p class="hint">'+(window.__cloud?'☁ Online database ito: makikita ng lahat ng may link ang mga naka-save.':'Naka-save ang data sa device/browser na ito lang.')+' Pindutin ang <b>Backup</b> para mag-save ng file na pwedeng ipadala sa iba. Pindutin ang <b>I-Restore</b> at piliin ang backup file para ibalik ang data.</p><div class="acts"><button class="btn" data-a="exp">💾 Backup</button><button class="btn g" data-a="imp">📂 I-Restore</button>'+(window.__cloud?'<button class="btn g" data-a="diag">🔍 Subukan ang koneksyon</button>':'')+'</div><input type="file" id="bkf" accept=".json,application/json" hidden></div>';
 return h}
function lbl(x){var p=x.pid?byId(x.pid):null,d=x.data||{};
 if(x.type==='add')return '➕ Dagdag: <b>'+esc(dn(d))+'</b> (anak ni '+esc(byId(d.parent)?dn(byId(d.parent)):'?')+')';
 if(x.type==='edit')return '✏️ Edit: <b>'+esc(p?dn(p):'?')+'</b> → '+esc(dn(d));
 if(x.type==='del')return '🗑 Delete: <b>'+esc(p?dn(p):'?')+'</b> (at mga inapo)';
 return '📝 Tala: '+esc(d.text)}
function pend(){return '<div class="box"><h3>⏳ Naghihintay ng Approval</h3>'+(Q.length?Q.map(function(x){return '<div class="person"><div class="pr">'+(x.data&&x.data.photo?'<div class="av" style="background:#6366f1;--c:#6366f1;width:48px;height:48px"><img alt="" src="'+esc(psrc(x.data.photo))+'"></div>':'')+'<div>'+lbl(x)+'</div></div>'+(isAdmin?'<div class="acts"><button class="btn ok s" data-a="ap" data-id="'+x.id+'">Approve</button><button class="btn r s" data-a="rj" data-id="'+x.id+'">Reject</button></div>':'')+'</div>'}).join(''):'<div class="empty">Walang naghihintay.</div>')+(isAdmin?'':'<p class="hint">Admin lang ang makaka-approve.</p>')+'</div>'}

function modal(h){$('dc').innerHTML=h;if(!$('dlg').open)$('dlg').showModal()}
function w(p){return db.collection(p)}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(function(){e.style.display='none'},3500)}
function fail(e){msg='May error: '+(e&&(e.code||e.message)||'')+' — subukan ulit.';toast('May error. Subukan ulit.');render()}
function notifyReq(x){var d=x.data||{},a=null;
 if(x.type==='add'){var pp=byId(d.parent);a={type:'req',name:dn(d),parent:pp?dn(pp):''}}
 else if(x.type==='edit'){var o=byId(x.pid);if(d.dead&&o&&!o.dead)a={type:'reqdead',name:dn(d)}}
 if(!a)return Promise.resolve();var aid=uid();markSeen(aid);a.ts=Date.now();return w('alerts').doc(aid).set(a)}
function submit(x){
 var id=uid();
 if(isAdmin)return apply(x).then(function(){toast('Na-save ✔')}).catch(fail);
 x.ts=Date.now();return w('pending').doc(id).set(x).then(function(){return notifyReq(x)}).then(function(){msg='Naipadala sa Admin para ma-approve.';toast('Naipadala sa Admin');render()}).catch(fail);
}
function apply(x,fp){
 var d=x.data||{};
 if(x.type==='add'){var id=uid();return w('people').doc(id).set({name:d.name,parent:d.parent,spouses:d.spouses||[],dead:!!d.dead,off:d.off||'',note:d.note||'',photo:d.photo||'',gender:d.gender||'',mid:d.mid||'',nick:d.nick||'',born:d.born||'',ts:Date.now()}).then(function(){if(fp)return;var aid=uid(),pp=byId(d.parent);markSeen(aid);return w('alerts').doc(aid).set({type:'new',pid:id,name:dn(d),parent:pp?dn(pp):'',ts:Date.now()})})}
 if(x.type==='edit'){var old=byId(x.pid),nd=!!d.dead&&!!old&&!old.dead,aid=uid();return w('people').doc(x.pid).update({name:d.name,spouses:d.spouses||[],dead:!!d.dead,off:d.off||'',note:d.note||'',photo:d.photo||'',gender:d.gender||'',mid:d.mid||'',nick:d.nick||'',born:d.born||''}).then(function(){if(nd&&!fp){markSeen(aid);return w('alerts').doc(aid).set({pid:x.pid,name:dn(d),ts:Date.now()})}})}
 if(x.type==='del')return Promise.all(desc(x.pid).map(function(i){return w('people').doc(i).delete()}));
 if(x.type==='note'){var n=uid();return w('notes').doc(n).set({text:d.text,date:new Date().toISOString().slice(0,10),ts:Date.now()})}
 return Promise.resolve();
}
